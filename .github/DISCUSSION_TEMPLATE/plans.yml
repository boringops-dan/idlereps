title: '[Plan] '
labels: [plan]
body:
  - type: input
    id: name
    attributes:
      label: Plan name
    validations:
      required: true
  - type: input
    id: equipment
    attributes:
      label: Equipment
      description: For example none, dumbbells, a pull-up bar, resistance bands, a kettlebell.
    validations:
      required: true
  - type: dropdown
    id: days
    attributes:
      label: Days per week
      options: ['1', '2', '3', '4', '5', '6', '7']
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: The plan
      description: Your `~/.claude/idlereps/plan.json`.
      render: json
    validations:
      required: true
